<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meal Plan Guru</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#calendar" data-view-link="calendar">Meal Plan Guru</a>
      <nav class="topnav" aria-label="Main navigation">
        <a class="nav-link active" href="#calendar" aria-current="page" data-view-link="calendar">Calendar</a>
        <a class="nav-link" href="#recipes" data-view-link="recipes">Recipes</a>
        <a class="nav-link" href="#shopping" data-view-link="shopping">Shopping</a>
      </nav>
    </header>

    <main class="page">
      <section id="calendar" class="view active-view" aria-labelledby="calendar-title" data-view="calendar">
        <div class="calendar-toolbar">
          <button class="icon-button" type="button" data-calendar-prev aria-label="Previous month">&lsaquo;</button>
          <h1 id="calendar-title" class="calendar-title">Calendar</h1>
          <button class="icon-button" type="button" data-calendar-next aria-label="Next month">&rsaquo;</button>
        </div>
        <div class="calendar" aria-label="Meal planning calendar">
          <div class="calendar-weekdays" aria-hidden="true">
            <span>MON</span>
            <span>TUE</span>
            <span>WED</span>
            <span>THU</span>
            <span>FRI</span>
            <span>SAT</span>
            <span>SUN</span>
          </div>
          <div class="calendar-grid" data-calendar-grid></div>
        </div>
      </section>

      <section id="recipes" class="view" aria-labelledby="recipes-title" data-view="recipes" hidden>
        <h1 id="recipes-title" class="section-title">Recipes</h1>
        <div class="recipe-grid" aria-label="Recipe cards">
          <article class="recipe-card"></article>
          <article class="recipe-card"></article>
          <article class="recipe-card"></article>
          <article class="recipe-card"></article>
          <article class="recipe-card"></article>
          <article class="recipe-card"></article>
          <article class="recipe-card"></article>
          <article class="recipe-card"></article>
          <article class="recipe-card"></article>
          <article class="recipe-card"></article>
          <article class="recipe-card"></article>
          <button class="recipe-card add-recipe-card" type="button" aria-label="Add recipe card">
            <span class="add-icon" aria-hidden="true">+</span>
            <span>Add card</span>
          </button>
        </div>
      </section>

      <section id="shopping" class="view" aria-labelledby="shopping-title" data-view="shopping" hidden>
        <h1 id="shopping-title" class="section-title">Shopping</h1>
      </section>
    </main>

    <div class="modal-overlay" data-recipe-modal hidden>
      <section class="recipe-modal" role="dialog" aria-modal="true" aria-labelledby="recipe-modal-title">
        <div class="modal-header">
          <h2 id="recipe-modal-title" data-recipe-modal-title>Add recipe</h2>
          <button class="modal-close" type="button" aria-label="Close recipe form" data-close-recipe-modal>&times;</button>
        </div>
        <form class="recipe-form" data-recipe-form>
          <label class="form-field">
            <span>Recipe name</span>
            <input type="text" name="recipeName" autocomplete="off" required>
          </label>
          <label class="form-field">
            <span>Ingredients</span>
            <textarea name="ingredients" rows="6" required></textarea>
          </label>
          <label class="form-field">
            <span>Photo</span>
            <input type="file" name="photo" accept="image/*">
          </label>
          <button class="form-submit" type="submit" data-recipe-submit>Add</button>
        </form>
      </section>
    </div>

    <div class="modal-overlay" data-delete-modal hidden>
      <section class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
        <h2 id="delete-modal-title">Remove recipe?</h2>
        <p>This will remove the recipe card from the page.</p>
        <div class="confirm-actions">
          <button class="secondary-button" type="button" data-cancel-delete>Cancel</button>
          <button class="danger-button" type="button" data-confirm-delete>Remove</button>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
